# ================================
# Aplicação
# ================================
spring.application.name=padaria
server.port=8080

# ================================
# Banco de Dados — PostgreSQL
# ================================
spring.datasource.url=jdbc:postgresql://localhost:5432/padaria_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ================================
# JPA / Hibernate
# ================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ================================
# JWT
# ================================
app.jwt.secret=sua-chave-secreta-muito-longa-e-segura-minimo-256-bits-aqui
app.jwt.expiration-ms=86400000

# ================================
# Segurança — desabilita a senha gerada pelo Spring
# ================================
spring.security.user.name=
spring.security.user.password=
